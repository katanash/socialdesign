databases:
  - name: socialdesign-db
    databaseName: socialdesign
    user: socialdesign
    plan: free

services:
  - type: web
    name: socialdesign
    runtime: ruby
    plan: free
    buildCommand: |
      bundle install
      bundle exec rails db:migrate
      bundle exec rails db:seed
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: socialdesign-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
